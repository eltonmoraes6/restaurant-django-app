{% extends "base.html" %}
{% block hero %}{% endblock hero %}
{% block main %}

<section class="layout_padding">
    <div class="container text-center">
        <div class="heading_container">
            <h2>Pagamento de Demonstração</h2>
        </div>
        <p>Este é um sistema de pagamento fictício.</p>

        <h3>Total a Cobrar: <strong>R${{ total }}</strong></h3>

        <div style="font-size: 60px; margin: 20px;">💳</div>

        <p>Processando pagamento...</p>

        <script>
            setTimeout(() => {
                window.location.href = "{% url 'ConfirmOrder' %}";
            }, 2000);
        </script>

        <p><small>Você será redirecionado em 2 segundos...</small></p>
    </div>
</section>

{% endblock %}
